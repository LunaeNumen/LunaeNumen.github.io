    <style>
        * {

        .forecast {

    <script>
        const KRAKOW_LAT = 50.0647;
        const KRAKOW_LON = 19.9450;

        const weatherIcons = {
            clear: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f1e1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
            cloudy: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f1e1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
            rain: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f1e1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>',
            snow: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f1e1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="m5 9 7-7 7 7"/><path d="m5 15 7 7 7-7"/><line x1="2" y1="12" x2="22" y2="12"/></svg>',
            fog: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f1e1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M3 14h18M3 18h18"/></svg>',
            thunder: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f1e1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'
        };

        const weatherCodes = {
            0: { description: 'Clear sky', icon: 'clear' },
            1: { description: 'Mainly clear', icon: 'clear' },
            2: { description: 'Partly cloudy', icon: 'cloudy' },
            3: { description: 'Overcast', icon: 'cloudy' },
            45: { description: 'Foggy', icon: 'fog' },
            48: { description: 'Foggy', icon: 'fog' },
            51: { description: 'Light drizzle', icon: 'rain' },
            53: { description: 'Drizzle', icon: 'rain' },
            55: { description: 'Heavy drizzle', icon: 'rain' },
            61: { description: 'Light rain', icon: 'rain' },
            63: { description: 'Rain', icon: 'rain' },
            65: { description: 'Heavy rain', icon: 'rain' },
            71: { description: 'Light snow', icon: 'snow' },
            73: { description: 'Snow', icon: 'snow' },
            75: { description: 'Heavy snow', icon: 'snow' },
            77: { description: 'Snow grains', icon: 'snow' },
            80: { description: 'Light showers', icon: 'rain' },
            81: { description: 'Showers', icon: 'rain' },
            82: { description: 'Heavy showers', icon: 'rain' },
            85: { description: 'Light snow showers', icon: 'snow' },
            86: { description: 'Snow showers', icon: 'snow' },
            95: { description: 'Thunderstorm', icon: 'thunder' },
            96: { description: 'Thunderstorm with hail', icon: 'thunder' },
            99: { description: 'Thunderstorm with hail', icon: 'thunder' }
        };

        function getMoonPhase(date = new Date()) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();

            let jd = 367 * year - Math.floor(7 * (year + Math.floor((month + 9) / 12)) / 4) +
                     Math.floor(275 * month / 9) + day + 1721013.5;

            const daysSinceNew = jd - 2451549.5;
            const newMoons = daysSinceNew / 29.53058867;
            const phase = newMoons - Math.floor(newMoons);
            const illumination = (1 - Math.cos(phase * 2 * Math.PI)) / 2 * 100;

            return { phase: phase, illumination: illumination };
        }

        function getMoonPhaseName(phase) {
            if (phase < 0.03 || phase > 0.97) return 'New';
            if (phase < 0.22) return 'Waxing';
            if (phase < 0.28) return '1st Qtr';
            if (phase < 0.47) return 'Waxing';
            if (phase < 0.53) return 'Full';
            if (phase < 0.72) return 'Waning';
            if (phase < 0.78) return 'Last Qtr';
            return 'Waning';
        }

        function getMoonSVG(phase) {
            const illum = phase;
            let moonPath;

            if (illum < 0.25) {
                const curve = (illum * 4) * 50 - 25;
                moonPath = `M 50 10 A 40 40 0 0 1 50 90 Q ${50 + curve} 50 50 10 Z`;
            } else if (illum < 0.5) {
                const curve = ((illum - 0.25) * 4) * 50 - 25;
                moonPath = `M 50 10 A 40 40 0 0 1 50 90 Q ${50 - curve} 50 50 10 Z`;
            } else if (illum < 0.75) {
                const curve = ((illum - 0.5) * 4) * 50 - 25;
                moonPath = `M 50 10 A 40 40 0 0 0 50 90 Q ${50 + curve} 50 50 10 Z`;
            } else {
                const curve = ((illum - 0.75) * 4) * 50 - 25;
                moonPath = `M 50 10 A 40 40 0 0 0 50 90 Q ${50 - curve} 50 50 10 Z`;
            }

            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" fill="none" stroke="#1f1e1d" stroke-width="3"/>
                <path d="${moonPath}" fill="#1f1e1d"/>
            </svg>`;
        }

        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${KRAKOW_LAT}&longitude=${KRAKOW_LON}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Warsaw&forecast_days=5`;

                const response = await fetch(url);
                if (!response.ok) throw new Error('Weather data unavailable');

                const data = await response.json();
                displayWidget(data);
            } catch (error) {
                document.getElementById('mainWidget').innerHTML = `
                    <div class="error">Unable to load data</div>
                `;
                setTimeout(fetchWeather, 5000);
            }
        }

        function displayWidget(data) {
            const current = data.current;
            const weatherCode = current.weather_code;
            const weatherInfo = weatherCodes[weatherCode] || { description: 'Unknown', icon: 'clear' };
            const iconSvg = weatherIcons[weatherInfo.icon];

            // Moon phase
            const moonData = getMoonPhase();
            const moonName = getMoonPhaseName(moonData.phase);
            const moonSvg = getMoonSVG(moonData.phase);

            // Get next 4 days forecast (skip today, indices 1-4)
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const forecastHTML = [1, 2, 3, 4].map(i => {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const dayName = days[date.getDay()];
                const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[i]);

                return `
                    <div class="forecast-day">
                        <div class="day-label">${dayName}</div>
                        <div class="temp-range">
                            <div class="temp-day">${maxTemp}°</div>
                            <div class="temp-night">${minTemp}°</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('mainWidget').innerHTML = `
                <div class="header">
                    <div class="location">Kraków</div>
                    <div class="moon-info">
                        <div class="moon-visual-small">${moonSvg}</div>
                        <span>${moonName}</span>
                    </div>
                </div>
                <div class="main-weather">
                    <div class="temperature">${Math.round(current.temperature_2m)}°C</div>
                    <div class="weather-icon">${iconSvg}</div>
                </div>
                <div class="condition">${weatherInfo.description}</div>
                <div class="forecast">
                    ${forecastHTML}
                </div>
            `;
        }

        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);
    </script>
